sources:
  unam_repository:
    enabled: true
    base_url: "https://repositorio.unam.mx/oai"
    metadata_prefix: "oai_dc"
    from_date: "2015-01-01"
    until_date: null
  openalex:
    enabled: false
    base_url: "https://api.openalex.org"
    ror_id: "01tmp8f25"
    per_page: 200
  scielo:
    enabled: true
    base_url: "https://www.scielo.org.mx/oai/scielo-oai.php"
    metadata_prefix: "oai_dc"
    from_date: "2015-01-01"
    until_date: null

ingest:
  max_records_per_source: 2000  # 0 = no limit
  polite_pause_seconds: 2.0
  request_timeout_seconds: 120
  request_max_retries: 6
  retry_backoff_seconds: 3
  continue_on_source_error: true
  parallel_time_windows: false
  window_days: 7
  max_parallel_workers: 4

paths:
  raw: "data/raw"
  processed: "data/processed"
  index: "data/index"

embeddings:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  batch_size: 64

umap:
  n_neighbors: 30
  min_dist: 0.05
  n_components: 2
  metric: "cosine"

clustering:
  method: "hdbscan"
  min_cluster_size: 30

som:
  enabled: true
  grid_x: 30
  grid_y: 20
  sigma: 1.5
  learning_rate: 0.5
  train_sample_size: 50000
