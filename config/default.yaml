ingest:
  max_records_per_source: 0  # 0 = no limit
  polite_pause_seconds: 2.0
  request_timeout_seconds: 120
  request_max_retries: 6
  retry_backoff_seconds: 3

paths:
  raw: "data/raw"
  processed: "data/processed"
  index: "data/index"

embeddings:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  ct2_model_dir: "data/models/compiled_miniLM"
  batch_size: 64

umap:
  n_neighbors: 30
  min_dist: 0.05
  n_components: 2
  metric: "cosine"

clustering:
  method: "hdbscan"
  min_cluster_size: 30

som:
  enabled: true
  grid_x: 30
  grid_y: 20
  sigma: 1.5
  learning_rate: 0.5
  train_sample_size: 50000

server:
  port: 8000
